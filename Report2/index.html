<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects Dashboard</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f5f7; --surface:#ffffff; --subsurface:#f7f9fb; --text:#1c2733; --muted:#5d6b7a; --line:#d9e0e6;
  --accent:#1f6f8b; --accent-text:#ffffff;
  --ok:#1d7a46; --okbg:#e0f3e8; --warn:#9a6200; --warnbg:#fbefd5; --bad:#a63232; --badbg:#f9e0e0;
  --idle:#4f5d6b; --idlebg:#e8ecf0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12181e; --surface:#1b242d; --subsurface:#16202a; --text:#e6ecf1; --muted:#97a6b4; --line:#2e3b47;
    --accent:#5bb5d3; --accent-text:#0d1a21;
    --ok:#6fd49a; --okbg:#173a28; --warn:#f0c067; --warnbg:#3d2f10; --bad:#f09a9a; --badbg:#431d1d;
    --idle:#b3c0cc; --idlebg:#26323d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181e; --surface:#1b242d; --subsurface:#16202a; --text:#e6ecf1; --muted:#97a6b4; --line:#2e3b47;
  --accent:#5bb5d3; --accent-text:#0d1a21;
  --ok:#6fd49a; --okbg:#173a28; --warn:#f0c067; --warnbg:#3d2f10; --bad:#f09a9a; --badbg:#431d1d;
  --idle:#b3c0cc; --idlebg:#26323d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px clamp(16px,4vw,40px) 0}
h1{margin:0 0 14px;font-size:1.4rem;font-weight:650}
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{appearance:none;border:1px solid var(--line);border-bottom:none;background:var(--surface);color:var(--muted);
  padding:10px 20px;border-radius:8px 8px 0 0;font:inherit;font-weight:600;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.tab:focus-visible,.twisty:focus-visible,.link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding:24px clamp(16px,4vw,40px) 40px;max-width:1000px}
.summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:120px}
.stat b{display:block;font-size:1.5rem}
.stat span{color:var(--muted);font-size:.9rem}
.proj-desc{color:var(--muted);margin:0 0 16px}
.toolbar{display:flex;justify-content:flex-end;gap:16px;margin-bottom:8px}
.link{appearance:none;border:none;background:none;color:var(--accent);font:inherit;font-size:.9rem;font-weight:600;cursor:pointer;padding:2px 4px}
.table{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.9rem}
tr:last-child td{border-bottom:none}
.mod td{font-weight:550}
.name{display:flex;align-items:center;gap:8px}
.twisty{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:26px;height:26px;border-radius:6px;
  cursor:pointer;display:inline-grid;place-items:center;flex:none;font:inherit;line-height:1;padding:0}
.twisty svg{width:12px;height:12px;transition:transform .15s}
.twisty[aria-expanded="true"] svg{transform:rotate(90deg)}
.count{color:var(--muted);font-size:.8rem;font-weight:500}
.sub td{background:var(--subsurface);font-size:.93rem}
.sub .name{padding-left:42px}
.sub .name::before{content:"";width:10px;height:10px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);border-radius:0 0 0 4px;margin-top:-6px;flex:none}
.sub[hidden]{display:none}
.bar{height:8px;background:var(--line);border-radius:4px;min-width:90px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.done{background:var(--okbg);color:var(--ok)}
.prog{background:var(--warnbg);color:var(--warn)}
.risk{background:var(--badbg);color:var(--bad)}
.idle{background:var(--idlebg);color:var(--idle)}
</style>
</head>
<body>
<header>
  <h1>Projects</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>
<main id="panel" role="tabpanel" aria-live="polite"></main>

<script>
/* Hierarchy: Project > Module > Submodule.
   Submodule: [name, owner, status, pct, due]
   Module progress and status are derived from its submodules. */
const projects = {
  A: { name: "Project A", desc: "Customer portal redesign", modules: [
    {n:"Login & Auth", owner:"Priya", due:"2026-08-30", subs:[
      ["Sign-in form","Priya","Done",100,"2026-08-10"],
      ["Single sign-on","Kofi","Done",100,"2026-08-20"],
      ["Password reset","Priya","Done",100,"2026-08-30"]]},
    {n:"User Profile", owner:"Marcus", due:"2026-10-25", subs:[
      ["Profile view","Marcus","Done",100,"2026-10-05"],
      ["Edit profile","Marcus","In progress",70,"2026-10-18"],
      ["Avatar upload","Jun","In progress",40,"2026-10-25"]]},
    {n:"Billing Page", owner:"Lena", due:"2026-11-10", subs:[
      ["Invoice list","Lena","In progress",90,"2026-10-30"],
      ["Payment methods","Omar","In progress",45,"2026-11-05"],
      ["Refund requests","Lena","Not started",0,"2026-11-10"]]},
    {n:"Notifications", owner:"Tom", due:"2026-11-20", subs:[
      ["Email alerts","Tom","In progress",40,"2026-11-10"],
      ["In-app inbox","Mei","At risk",20,"2026-11-18"],
      ["Preferences","Tom","Not started",0,"2026-11-20"]]}]},
  B: { name: "Project B", desc: "Mobile app v2", modules: [
    {n:"Onboarding Flow", owner:"Aisha", due:"2026-09-15", subs:[
      ["Welcome screens","Aisha","Done",100,"2026-09-01"],
      ["Permission prompts","Leo","Done",100,"2026-09-08"],
      ["Interactive tutorial","Aisha","Done",100,"2026-09-15"]]},
    {n:"Offline Sync", owner:"Diego", due:"2026-11-05", subs:[
      ["Local cache","Diego","In progress",70,"2026-10-25"],
      ["Conflict resolution","Hana","At risk",20,"2026-11-02"],
      ["Background sync","Diego","At risk",15,"2026-11-05"]]},
    {n:"Push Messaging", owner:"Sam", due:"2026-10-31", subs:[
      ["Device registration","Sam","Done",100,"2026-10-10"],
      ["Topic subscriptions","Sam","In progress",60,"2026-10-24"],
      ["Rich notifications","Ravi","In progress",20,"2026-10-31"]]}]},
  C: { name: "Project C", desc: "Data warehouse migration", modules: [
    {n:"Schema Mapping", owner:"Chen", due:"2026-07-20", subs:[
      ["Source inventory","Chen","Done",100,"2026-07-05"],
      ["Field mapping","Chen","Done",100,"2026-07-14"],
      ["Mapping sign-off","Rita","Done",100,"2026-07-20"]]},
    {n:"ETL Pipelines", owner:"Olu", due:"2026-10-28", subs:[
      ["Extract jobs","Olu","Done",100,"2026-10-10"],
      ["Transform rules","Olu","In progress",80,"2026-10-22"],
      ["Load jobs","Yuki","In progress",60,"2026-10-28"]]},
    {n:"Quality Checks", owner:"Rita", due:"2026-11-12", subs:[
      ["Row count checks","Rita","Done",100,"2026-10-30"],
      ["Duplicate detection","Rita","In progress",50,"2026-11-06"],
      ["Anomaly alerts","Sven","In progress",15,"2026-11-12"]]},
    {n:"Reporting Layer", owner:"Ivan", due:"2026-12-05", subs:[
      ["Semantic model","Ivan","In progress",30,"2026-11-20"],
      ["Dashboards","Ivan","In progress",15,"2026-12-01"],
      ["Access control","Nadia","Not started",0,"2026-12-05"]]},
    {n:"Cutover Plan", owner:"Chen", due:"2026-12-15", subs:[
      ["Runbook","Chen","In progress",20,"2026-12-01"],
      ["Rollback plan","Chen","At risk",10,"2026-12-08"],
      ["Dry run","Olu","Not started",0,"2026-12-15"]]}]},
  D: { name: "Project D", desc: "Internal HR tooling", modules: [
    {n:"Leave Requests", owner:"Nina", due:"2026-09-01", subs:[
      ["Request form","Nina","Done",100,"2026-08-20"],
      ["Approval workflow","Nina","Done",100,"2026-09-01"]]},
    {n:"Org Chart", owner:"Paul", due:"2026-09-22", subs:[
      ["Data import","Paul","Done",100,"2026-09-10"],
      ["Chart view","Paul","Done",100,"2026-09-22"]]},
    {n:"Performance Reviews", owner:"Zoe", due:"2026-11-30", subs:[
      ["Self review","Zoe","Done",100,"2026-10-31"],
      ["Manager review","Zoe","In progress",50,"2026-11-15"],
      ["Calibration","Abel","Not started",0,"2026-11-30"]]}]}
};

const cls = {"Done":"done","In progress":"prog","At risk":"risk","Not started":"idle"};
const tabs = document.getElementById("tabs"), panel = document.getElementById("panel");
const chevron = '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let current = "A";
const open = new Set();               // expanded module ids, e.g. "A-0"

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function derive(mod){
  const s = mod.subs;
  const pct = Math.round(s.reduce((t,x) => t + x[3], 0) / s.length);
  const status = s.every(x => x[2] === "Done") ? "Done"
               : s.some(x => x[2] === "At risk") ? "At risk"
               : s.every(x => x[2] === "Not started") ? "Not started" : "In progress";
  return {pct, status};
}
const bar = pct => `<div class="bar" title="${pct}%"><i style="width:${pct}%"></i></div>`;
const badge = st => `<span class="badge ${cls[st]}">${st}</span>`;

function show(key){
  current = key;
  [...tabs.children].forEach(b => b.setAttribute("aria-selected", b.dataset.key === key));
  const p = projects[key];
  const info = p.modules.map(m => ({m, ...derive(m)}));
  const subCount = p.modules.reduce((t,m) => t + m.subs.length, 0);
  const done = info.filter(x => x.status === "Done").length;
  const avg = Math.round(info.reduce((s,x) => s + x.pct, 0) / info.length);

  const rows = info.map((x, i) => {
    const id = key + "-" + i, isOpen = open.has(id);
    const head = `<tr class="mod">
      <td><div class="name">
        <button class="twisty" aria-expanded="${isOpen}" aria-controls="sub-${id}" data-id="${id}"
          aria-label="${isOpen ? "Collapse" : "Expand"} ${esc(x.m.n)} submodules">${chevron}</button>
        <span>${esc(x.m.n)} <span class="count">(${x.m.subs.length})</span></span></div></td>
      <td>${esc(x.m.owner)}</td><td>${badge(x.status)}</td><td>${bar(x.pct)}</td><td>${x.m.due}</td></tr>`;
    const subs = x.m.subs.map(s => `<tr class="sub sub-${id}" ${isOpen ? "" : "hidden"}>
      <td><div class="name">${esc(s[0])}</div></td><td>${esc(s[1])}</td>
      <td>${badge(s[2])}</td><td>${bar(s[3])}</td><td>${s[4]}</td></tr>`).join("");
    return head + subs;
  }).join("");

  panel.innerHTML = `
    <h2 style="margin:0 0 4px">${esc(p.name)}</h2>
    <p class="proj-desc">${esc(p.desc)}</p>
    <div class="summary">
      <div class="stat"><b>${info.length}</b><span>Modules</span></div>
      <div class="stat"><b>${subCount}</b><span>Submodules</span></div>
      <div class="stat"><b>${done}</b><span>Modules completed</span></div>
      <div class="stat"><b>${avg}%</b><span>Overall progress</span></div>
    </div>
    <div class="toolbar">
      <button class="link" data-act="expand">Expand all</button>
      <button class="link" data-act="collapse">Collapse all</button>
    </div>
    <div class="table"><table>
      <thead><tr><th>Module / Submodule</th><th>Owner</th><th>Status</th><th>Progress</th><th>Due</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

panel.addEventListener("click", e => {
  const t = e.target.closest(".twisty");
  if (t){
    const id = t.dataset.id, willOpen = !open.has(id);
    willOpen ? open.add(id) : open.delete(id);
    t.setAttribute("aria-expanded", willOpen);
    t.setAttribute("aria-label", t.getAttribute("aria-label").replace(/^\w+/, willOpen ? "Collapse" : "Expand"));
    panel.querySelectorAll(".sub-" + id).forEach(r => r.hidden = !willOpen);
    return;
  }
  const a = e.target.closest("[data-act]");
  if (a){
    projects[current].modules.forEach((_, i) => {
      const id = current + "-" + i;
      a.dataset.act === "expand" ? open.add(id) : open.delete(id);
    });
    show(current);
  }
});

Object.keys(projects).forEach(k => {
  const b = document.createElement("button");
  b.className = "tab"; b.role = "tab"; b.dataset.key = k;
  b.textContent = projects[k].name;
  b.onclick = () => show(k);
  tabs.appendChild(b);
});
show("A");
</script>
</body>
</html>
